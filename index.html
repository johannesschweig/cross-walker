<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cross Walker</title>
  <meta name="description" content="Ein kleines Rätselspiel: Sammle Gold, weiche dem Feuer aus, überbrücke Flüsse mit Kisten.">
  <meta name="theme-color" content="#2b2b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cross Walker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <button id="levelBtn" type="button" aria-label="Level wählen">
        <span id="level">Level 1/1</span> <span class="caret">▾</span>
      </button>
      <div id="center">
        <div id="title">–</div>
        <div id="moves"></div>
      </div>
      <div id="gold" aria-live="polite">★ 0</div>
    </header>

    <main id="stage">
      <canvas id="game" width="512" height="512" aria-label="Cross-Walker-Spielfeld"></canvas>
    </main>

    <footer id="bar">
      <p id="hint"></p>
      <div id="dpad" hidden aria-label="Steuerkreuz">
        <button type="button" data-dir="up" aria-label="Hoch">▲</button>
        <button type="button" data-dir="left" aria-label="Links">◀</button>
        <button type="button" data-dir="right" aria-label="Rechts">▶</button>
        <button type="button" data-dir="down" aria-label="Runter">▼</button>
      </div>
      <div id="buttons">
        <button id="restart" type="button" aria-label="Level neu starten">⟳<span>Neustart</span></button>
        <button id="sound" type="button" aria-label="Ton ein- oder ausschalten">♪<span>Ton</span></button>
      </div>
    </footer>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="panel">
      <h2>Level</h2>
      <div id="levelGrid"></div>
      <button id="menuClose" type="button" class="primary">Schließen</button>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="panel">
      <h2 id="resultTitle">Level geschafft</h2>
      <div id="resultStars" class="stars" aria-live="polite"></div>
      <p id="resultInfo" class="info"></p>
      <p id="resultTip" class="tip"></p>
      <div class="row">
        <button id="resultRetry" type="button">Nochmal</button>
        <button id="resultNext" type="button" class="primary">Nächstes Level</button>
      </div>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="panel">
      <h2>Du hast es geschafft!</h2>
      <p id="endGold"></p>
      <button id="again" type="button" class="primary">Nochmal spielen</button>
    </div>
  </div>

  <div id="rotate" role="alert">
    <div>
      <div class="phone" aria-hidden="true">📱</div>
      <p>Bitte halte dein Handy aufrecht</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
